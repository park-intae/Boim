      <circle cx="27" cy="27" r="13" fill="#3478F6"/><text x="27" y="31" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
      <text x="51" y="32" font-size="13" font-weight="700">기본 정보</text>
      <circle cx="190" cy="27" r="13" fill="#E8EDF5"/><text x="190" y="31" text-anchor="middle" font-size="11" fill="#7B8798">2</text>
      <text x="214" y="32" font-size="13" fill="#8794A8">납입/기간 정보</text>
      <circle cx="380" cy="27" r="13" fill="#E8EDF5"/><text x="380" y="31" text-anchor="middle" font-size="11" fill="#7B8798">3</text>
      <text x="404" y="32" font-size="13" fill="#8794A8">보장 정보</text>
    </g>
    <g transform="translate(34 190)">
      <text x="0" y="0" class="label">보험사</text><rect x="0" y="14" width="250" height="43" rx="9" fill="#FFFFFF" stroke="#E1E7F0"/><text x="14" y="41" class="small">보험사를 선택하세요</text>
      <text x="274" y="0" class="label">상품명</text><rect x="274" y="14" width="248" height="43" rx="9" fill="#FFFFFF" stroke="#E1E7F0"/><text x="288" y="41" class="small">상품명을 입력하세요</text>
      <text x="0" y="91" class="label">보험 종류</text><rect x="0" y="105" width="250" height="43" rx="9" fill="#FFFFFF" stroke="#E1E7F0"/><text x="14" y="132" class="small">보험 종류 선택</text>
      <text x="274" y="91" class="label">가입일</text><rect x="274" y="105" width="248" height="43" rx="9" fill="#FFFFFF" stroke="#E1E7F0"/><text x="288" y="132" class="small">YYYY.MM.DD</text>
    </g>
    <rect x="34" y="420" width="522" height="54" rx="12" fill="#3478F6"/>
    <text x="295" y="454" text-anchor="middle" font-size="15" font-weight="750" fill="#FFFFFF">다음 단계로</text>
  </g>

  <!-- closing CTA -->
  <g transform="translate(120 2730)">
    <rect width="1200" height="330" rx="28" fill="#142B50"/>
    <circle cx="1050" cy="90" r="130" fill="#1D3D6D" opacity=".8"/>
    <circle cx="1110" cy="250" r="90" fill="#244C83" opacity=".55"/>
    <text x="70" y="86" font-size="14" font-weight="750" letter-spacing="2" fill="#9DBFFF">START WITH BOIM</text>
    <text x="70" y="154" font-size="38" font-weight="800" fill="#FFFFFF">내 보험 관리, 이제 보임에서.</text>
    <text x="70" y="198" font-size="17" fill="#C4D1E4">나의 보험 현황을 정리하고 중요한 일정을 챙겨보세요.</text>
    <rect x="70" y="238" width="190" height="54" rx="13" fill="#FFFFFF"/>
    <text x="165" y="272" text-anchor="middle" font-size="15" font-weight="800" fill="#2867E8">무료로 시작하기 →</text>
