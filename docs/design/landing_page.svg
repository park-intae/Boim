<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3200" viewBox="0 0 1440 3200">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF4FF"/>
      <stop offset="1" stop-color="#F8FAFF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D8BFA"/>
      <stop offset="1" stop-color="#2867E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1D3557" flood-opacity=".10"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#253858" flood-opacity=".08"/>
    </filter>
    <style>
      text{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#17243B}
      .muted{fill:#718096}.blue{fill:#3478F6}.white{fill:#fff}
      .eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#3979ED}
      .h1{font-size:58px;font-weight:800;letter-spacing:-2.8px}
      .h2{font-size:38px;font-weight:800;letter-spacing:-1.5px}
      .body{font-size:18px;fill:#64748B}
      .small{font-size:13px;fill:#8794A8}
      .label{font-size:14px;font-weight:700;fill:#66758B}
      .cardtitle{font-size:19px;font-weight:750}
      .metric{font-size:28px;font-weight:800}
    </style>
  </defs>

  <!-- background -->
  <rect width="1440" height="3200" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1440" height="900" fill="url(#hero)"/>

  <!-- navigation -->
  <g transform="translate(120 0)">
    <text x="0" y="66" font-size="30" font-weight="850" letter-spacing="-1.5">boim<span fill="#3478F6">.</span></text>
    <text x="460" y="61" font-size="15" font-weight="650" fill="#506078">서비스 소개</text>
    <text x="590" y="61" font-size="15" font-weight="650" fill="#506078">주요 기능</text>
    <text x="700" y="61" font-size="15" font-weight="650" fill="#506078">이용 방법</text>
    <rect x="1052" y="25" width="108" height="44" rx="12" fill="#FFFFFF" stroke="#DCE5F2"/>
    <text x="1106" y="53" text-anchor="middle" font-size="14" font-weight="700">로그인</text>
    <rect x="1172" y="25" width="148" height="44" rx="12" fill="#3478F6"/>
    <text x="1246" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">무료로 시작하기</text>
  </g>

  <!-- hero copy -->
  <g transform="translate(120 0)">
    <rect x="0" y="175" width="178" height="34" rx="17" fill="#E1ECFF"/>
    <circle cx="18" cy="192" r="4" fill="#3478F6"/>
    <text x="32" y="197" font-size="13" font-weight="750" fill="#3478F6">나를 위한 보험 관리</text>
    <text x="0" y="300" class="h1">흩어진 내 보험,<tspan x="0" dy="76" fill="#3478F6">한눈에 보임.</tspan></text>
    <text x="0" y="470" class="body">가입한 보험부터 납입 일정과 보장 현황까지.</text>
    <text x="0" y="502" class="body">복잡했던 보험 관리를 보임에서 간편하게 시작하세요.</text>
    <rect x="0" y="552" width="190" height="58" rx="14" fill="url(#blue)" filter="url(#soft)"/>
    <text x="95" y="588" text-anchor="middle" font-size="16" font-weight="750" fill="#FFFFFF">내 보험 관리 시작</text>
    <text x="218" y="587" font-size="14" font-weight="650" fill="#718096">복잡한 절차 없이 간편하게</text>
    <g transform="translate(0 680)">
      <circle cx="8" cy="8" r="4" fill="#20B486"/><text x="22" y="13" font-size="13" fill="#718096">보험 현황 통합 관리</text>
      <circle cx="190" cy="8" r="4" fill="#20B486"/><text x="204" y="13" font-size="13" fill="#718096">납입·갱신 일정 알림</text>
    </g>
  </g>

  <!-- hero dashboard mockup -->
  <g transform="translate(720 145)" filter="url(#shadow)">
    <rect x="0" y="0" width="620" height="610" rx="24" fill="#FFFFFF"/>
    <rect x="0" y="0" width="620" height="58" rx="24" fill="#FFFFFF"/>
    <path d="M0 58H620" stroke="#EEF1F6"/>
    <text x="30" y="37" font-size="17" font-weight="850">boim<span fill="#3478F6">.</span></text>
    <text x="465" y="36" font-size="12" fill="#8A97AA">안녕하세요, 인태님</text>
    <circle cx="584" cy="29" r="15" fill="#EFF4FC"/>
    <text x="584" y="34" text-anchor="middle" font-size="12">P</text>
    <text x="30" y="100" font-size="20" font-weight="800">보험 일정</text>
    <text x="30" y="124" font-size="11" fill="#94A0B2">이번 달 보험 흐름을 확인해 보세요.</text>
    <!-- metric cards -->
    <g transform="translate(30 150)">
      <rect width="130" height="88" rx="13" fill="#F7F9FC"/>
      <text x="16" y="27" class="small">가입 보험</text><text x="16" y="63" class="metric">7<tspan font-size="14" fill="#718096">개</tspan></text>
      <rect x="145" width="130" height="88" rx="13" fill="#F7F9FC"/>
      <text x="161" y="27" class="small">이번 달 납입</text><text x="161" y="63" class="metric">3<tspan font-size="14" fill="#718096">건</tspan></text>
      <rect x="290" width="130" height="88" rx="13" fill="#F7F9FC"/>
      <text x="306" y="27" class="small">갱신 예정</text><text x="306" y="63" class="metric">2<tspan font-size="14" fill="#718096">건</tspan></text>
      <rect x="435" width="125" height="88" rx="13" fill="#F7F9FC"/>
      <text x="451" y="27" class="small">만기 예정</text><text x="451" y="63" class="metric">1<tspan font-size="14" fill="#718096">건</tspan></text>
    </g>
