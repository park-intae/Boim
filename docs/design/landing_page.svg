  <!-- trusted strip -->
  <g transform="translate(120 840)">
    <text x="0" y="0" font-size="13" fill="#8290A4">보험을 더 명확하게 관리하는 새로운 습관</text>
    <path d="M0 28H1200" stroke="#E1E8F2"/>
  </g>

  <!-- features section -->
  <g transform="translate(120 1010)">
    <text class="eyebrow" x="0" y="0">WHAT YOU CAN DO</text>
    <text class="h2" x="0" y="62">보험 관리에 필요한 모든 것,</text>
    <text class="h2" x="0" y="110" fill="#3478F6">한곳에서 간편하게.</text>
    <text class="body" x="0" y="158">보임은 보험 정보를 모으고, 중요한 일정을 챙기고, 보장 상태를 살펴볼 수 있도록 돕습니다.</text>

    <!-- feature cards -->
    <g transform="translate(0 220)">
      <rect width="380" height="360" rx="22" fill="#F7F9FC"/>
      <circle cx="54" cy="58" r="26" fill="#E5EEFF"/>
      <path d="M45 58h18M54 49v18" stroke="#3478F6" stroke-width="2.5" stroke-linecap="round"/>
      <text x="32" y="125" class="cardtitle">내 보험 한눈에 관리</text>
      <text x="32" y="158" class="body" font-size="15">여러 보험사에 흩어진 가입 정보를</text>
      <text x="32" y="184" class="body" font-size="15">한 화면에서 확인하고 관리하세요.</text>
      <rect x="32" y="224" width="316" height="104" rx="13" fill="#FFFFFF" stroke="#E8EDF5"/>
      <text x="50" y="253" class="small">나의 보험 현황</text>
      <text x="50" y="292" font-size="27" font-weight="800">7개 <tspan font-size="13" fill="#8794A8" font-weight="500">가입 보험</tspan></text>
      <rect x="246" y="250" width="82" height="42" rx="9" fill="#EAF1FF"/>
      <text x="287" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#3478F6">전체 보기</text>
    </g>
    <g transform="translate(410 220)">
