      <text x="18" y="32" font-size="15" font-weight="750">2026년 8월</text>
      <text x="18" y="68" class="small">일</text><text x="65" y="68" class="small">월</text><text x="112" y="68" class="small">화</text><text x="159" y="68" class="small">수</text><text x="206" y="68" class="small">목</text><text x="253" y="68" class="small">금</text><text x="300" y="68" class="small">토</text>
      <path d="M12 82H328M12 126H328M12 170H328M12 214H328M12 258H328" stroke="#EFF2F7"/>
      <g font-size="12" fill="#69778B">
        <text x="18" y="108">1</text><text x="65" y="108">2</text><text x="112" y="108">3</text><text x="159" y="108">4</text><text x="206" y="108">5</text><text x="253" y="108">6</text><text x="300" y="108">7</text>
        <text x="18" y="152">8</text><text x="65" y="152">9</text><text x="112" y="152">10</text><text x="159" y="152">11</text><text x="206" y="152">12</text><text x="253" y="152">13</text><text x="300" y="152">14</text>
        <text x="18" y="196">15</text><text x="65" y="196">16</text><text x="112" y="196">17</text><text x="159" y="196">18</text><text x="206" y="196">19</text><text x="253" y="196">20</text><text x="300" y="196">21</text>
        <text x="18" y="240">22</text><text x="65" y="240">23</text><text x="112" y="240">24</text><text x="159" y="240">25</text><text x="206" y="240">26</text><text x="253" y="240">27</text><text x="300" y="240">28</text>
        <text x="18" y="284">29</text><text x="65" y="284">30</text><text x="112" y="284">31</text>
      </g>
      <circle cx="212" cy="147" r="4" fill="#3478F6"/><circle cx="258" cy="191" r="4" fill="#18B889"/><circle cx="304" cy="235" r="4" fill="#F28A55"/>
