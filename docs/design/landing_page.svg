      <circle cx="54" cy="58" r="26" fill="#E5F7F1"/>
      <path d="M54 43v16l11 7" stroke="#18A77D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <text x="32" y="125" class="cardtitle">납입·갱신 일정 알림</text>
      <text x="32" y="158" class="body" font-size="15">보험료 납입일과 갱신·만기일을</text>
      <text x="32" y="184" class="body" font-size="15">달력과 알림으로 놓치지 마세요.</text>
      <rect x="32" y="224" width="316" height="104" rx="13" fill="#FFFFFF" stroke="#E8EDF5"/>
      <circle cx="55" cy="255" r="5" fill="#3478F6"/><text x="70" y="260" font-size="13" font-weight="700">보험료 납입 알림</text>
      <text x="50" y="289" font-size="12" fill="#7C899C">삼성화재 건강보험 · 85,000원</text>
      <text x="50" y="312" font-size="11" fill="#18A77D">납입 완료</text>
    </g>
    <g transform="translate(820 220)">
      <rect width="380" height="360" rx="22" fill="#F7F9FC"/>
      <circle cx="54" cy="58" r="26" fill="#FFF1E8"/>
      <path d="M54 42l15 7v11c0 10-7 16-15 20-8-4-15-10-15-20V49z" stroke="#E98A50" stroke-width="2.2" fill="none"/>
      <text x="32" y="125" class="cardtitle">보장 상태 분석</text>
      <text x="32" y="158" class="body" font-size="15">항목별 보장 현황을 확인하고</text>
      <text x="32" y="184" class="body" font-size="15">부족한 보장을 파악해 보세요.</text>
      <rect x="32" y="224" width="316" height="104" rx="13" fill="#FFFFFF" stroke="#E8EDF5"/>
      <text x="50" y="253" class="small">종합 보장 점수</text>
      <text x="50" y="300" font-size="30" font-weight="800" fill="#3478F6">72<tspan font-size="13" fill="#8794A8"> / 100</tspan></text>
      <rect x="175" y="280" width="145" height="8" rx="4" fill="#E9EEF5"/>
      <rect x="175" y="280" width="104" height="8" rx="4" fill="#3478F6"/>
      <text x="175" y="266" font-size="11" fill="#7C899C">보장 상태 확인</text>
    </g>
  </g>

  <!-- product showcase -->
