      <circle cx="27" cy="91" r="4" fill="#3478F6"/>
      <text x="40" y="95" font-size="11" font-weight="750">보험료 납입</text>
      <text x="26" y="119" font-size="12" font-weight="700">삼성화재 건강보험</text>
      <text x="26" y="141" font-size="11" fill="#7C899C">85,000원 · 월 보험료 납입일</text>
      <rect x="14" y="174" width="172" height="91" rx="11" fill="#F8FAFD"/>
      <circle cx="27" cy="193" r="4" fill="#18B889"/>
      <text x="40" y="197" font-size="11" font-weight="750">갱신 예정</text>
      <text x="26" y="221" font-size="12" font-weight="700">KB손해보험 운전자보험</text>
      <text x="26" y="243" font-size="11" fill="#7C899C">8월 20일 갱신 예정</text>
      <text x="16" y="290" font-size="11" font-weight="700" fill="#3478F6">일정 전체 보기 →</text>
