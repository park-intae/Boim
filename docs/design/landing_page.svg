      <text x="34" y="16" font-size="17" font-weight="750">보험 정보를 등록하고</text>
      <text x="34" y="46" font-size="14" fill="#718096">보험사, 상품명, 가입일 등 기본 정보를 입력합니다.</text>
      <circle cx="10" cy="100" r="10" fill="#DCE7F8"/><text x="10" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#3478F6">2</text>
      <text x="34" y="106" font-size="17" font-weight="750">납입과 보장 내용을 정리하고</text>
      <text x="34" y="136" font-size="14" fill="#718096">납입 주기와 기간, 주요 보장 및 특약을 관리합니다.</text>
      <circle cx="10" cy="190" r="10" fill="#DCE7F8"/><text x="10" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#3478F6">3</text>
      <text x="34" y="196" font-size="17" font-weight="750">내 보험 상태를 확인하세요</text>
      <text x="34" y="226" font-size="14" fill="#718096">일정 알림과 보장 분석으로 전체 현황을 살펴봅니다.</text>
    </g>
  </g>
