    <text x="0" y="0" font-size="23" font-weight="850">boim<span fill="#3478F6">.</span></text>
    <text x="1200" y="0" text-anchor="end" font-size="12" fill="#8A97AA">© 2026 BOIM. All rights reserved.</text>
    <path d="M0 24H1200" stroke="#E8EDF3"/>
