  <g transform="translate(120 1980)">
    <text class="eyebrow" x="0" y="0">A CLEARER VIEW</text>
    <text class="h2" x="0" y="62">복잡한 보험 정보도</text>
    <text class="h2" x="0" y="110" fill="#3478F6">보기 쉽게 정리됩니다.</text>
    <text class="body" x="0" y="158">보험 등록부터 보장 분석까지, 필요한 정보를 단계별로 확인하세요.</text>
    <g transform="translate(0 220)">
