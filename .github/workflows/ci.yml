name: Boim CI Pipeline

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @boim/api exec prisma generate

      - name: Run Linters (oxlint & eslint)
        run: pnpm lint

      - name: Run Backend Unit Tests (Jest - 192 tests)
        run: pnpm --filter @boim/api test

      - name: Run Frontend Unit Tests (Vitest - 202 tests)
        run: pnpm --filter @boim/web exec vitest run

      - name: Build Monorepo (Turbo: shared-types, api, web)
        run: pnpm build

  docker-build:
    name: Docker Images Build Check
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: boim-api:ci-check

      - name: Build Web Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: boim-web:ci-check
