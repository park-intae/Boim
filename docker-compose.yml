services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: boim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boim
    ports:
      - "5432:5432"
    volumes:
      - boim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boim"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - boim-network

  # 2. NestJS Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: boim-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/boim?schema=public"
      JWT_SECRET: ${JWT_SECRET:-boim_jwt_secret_key_production_2026}
      USE_MOCK_PARSER: ${USE_MOCK_PARSER:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boim-network

  # 3. React SPA Frontend & Nginx Reverse Proxy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: boim-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - boim-network

volumes:
  boim_pgdata:
    driver: local

networks:
  boim-network:
    driver: bridge
