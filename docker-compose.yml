services:
  postgres:
    image: postgres:16-alpine
    container_name: boim-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boim
    ports:
      - "5432:5432"
    volumes:
      - boim_pgdata:/var/lib/postgresql/data

volumes:
  boim_pgdata:
