<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Boim - 리다이렉트 중...</title>
    <script type="text/javascript">
      // GitHub Pages SPA 404 Redirect Script (https://github.com/rafgraph/spa-github-pages)
      // 404 요청 시 URL 경로를 쿼리 파라미터로 변환하여 index.html로 복귀시킵니다.
      var pathSegmentsToKeep = 1; // 저장소 서브경로 (/Boim/) 유지

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?p=/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body>
    <p>페이지를 불러오는 중입니다...</p>
  </body>
</html>
